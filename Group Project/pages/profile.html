<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile</title>
        <link href="../stylesheet/baseStyle.css" rel="stylesheet" type="text/css">
        <link href="../stylesheet/profileStyle.css" rel="stylesheet" type="text/css">
        <script src="../javascript/profile.js" defer></script>
    </head>
    <body>
    <!-------------------------Header------------------------->
        <header>
            <button type="button" id="login">
                <figure>
                    <img class="icon" src="../img/BookStoreLogo.png" alt="Account">
                    <figcaption>Access Account</figcaption>
                </figure>
            </button>
            <a href="../home.html" class="header-click"></a>
            <button type="button" id="cart">
                <figure>
                    <a href="shoppingCart.html"><img class="icon" src="../img/CartLogo.png" alt="Checkout"></a>
                    <figcaption>Checkout</figcaption>
                </figure>
            </button>
        </header>
    <!---------------------End Header------------------------->

    <!---------------------Navigation Bar--------------------->
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="products.html">Products</a></li>
                <li><input type="text" placeholder="Search...">
                    <button style="border: 1px solid white;" type="button">Enter</button>
                </li>
            </ul>
        </nav>
    <!---------------------End Navigation Bar----------------->

    <!----------------------Main Content---------------------->
        <main>
            <div class="profile-wrapper">
    
                
                <div class="profile-card">
                    <div class="avatar-wrap">
                        <img id="profileAvatar" src="" alt="Profile Avatar">
                    </div>
                    <div class="api-info">
                        <p class="api-label">Account ID</p>
                        <p class="api-value" id="apiUserId">—</p>
    
                        <p class="api-label">Registered Email</p>
                        <p class="api-value" id="apiUserEmail">—</p>
    
                        <p class="api-label">Full Name</p>
                        <p class="api-value" id="apiFullName">—</p>
    
                    </div>
                    <div id="apiStatus" class="api-status"></div>
                </div>
    
                
                <div class="profile-edit">
                    <h2>My Profile</h2>
                    <p class="profile-subtitle">Edit your display information below. Changes are saved to your session.</p>
    
                    <div id="saveStatus" class="save-status" style="display:none;"></div>
    
                    <div class="formGroup">
                        <label for="editName">Display Name</label>
                        <input type="text" id="editName" placeholder="Your display name">
                        <span class="field-error" id="nameError"></span>
                    </div>
    
                    <div class="formGroup">
                        <label for="editEmail">Contact Email</label>
                        <input type="email" id="editEmail" placeholder="Your contact email">
                        <span class="field-error" id="emailError"></span>
                    </div>

                    <div class="formGroup">
                        <label for="editPassword">New Password</label>
                        <input type="password" id="editPassword" placeholder="Enter new password">
                        <span class="field-error" id="passwordError"></span>
                    </div>

                    <div class="formGroup">
                        <label for="editConfirmPassword">Confirm New Password</label>
                        <input type="password" id="editConfirmPassword" placeholder="Confirm new password">
                        <span class="field-error" id="confirmPasswordError"></span>
                    </div>
    
    
                    <div class="profile-actions">
                        <button type="button" id="saveBtn" class="btnForm">Save Changes</button>
                        <button type="button" id="logoutBtn" class="btnLogout">Logout</button>
                    </div>
                </div>
    
            </div>
        </main>
    <!--------------------End Main Content-------------------->

    <!---------------------Footer Content--------------------->
        <footer>
            <nav>
                <div class="footer-container">
                    <ul id="footerList">
                        <li>
                            <a href="about.html">About</a>
                        </li>
                        <li>
                            <a href="contact.html">Contact</a>
                        </li>
                        <li>
                            <div class="newsletter">
                                <label>Subscribe to our newsletter</label>
                                <input type="email" placeholder="Enter your email">
                                <button type="button">Subscribe</button>
                            </div>
                        </li>
                    </ul>

                    <div>
                        <p class="contact">Contact us: 821 Sainte-Croix Ave, Montreal H4L 3X9, Quebec 514-744-7500</p>
                    </div>

                    <div class="socials">
                        <label>Find us on social media</label>
                        <button type="button">
                            <img class="icon" src="../img/instagram.png" alt="Instagram">
                        </button>
                        <button type="button">
                            <img class="icon" src="../img/tiktok.png" alt="TikTok">
                        </button>
                        <button type="button">
                            <img class="icon" src="../img/twitter.png" alt="Twitter">
                        </button>
                    </div>
                </div>
            </nav>
        </footer>
    <!-------------------End Footer Content------------------->
    </body>
</html>
