<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link href="../stylesheet/baseStyle.css" rel="stylesheet" type="text/css">
    <link href="../stylesheet/checkoutStyle.css" rel="stylesheet" type="text/css">
    <script src="../javascript/acc.js" defer></script>
    <script src="../javascript/checkout.js" defer></script>
</head>
<body>
     <header>
        <button type="button" id="login">
            <figure>
                <a href="login.html"><img class="icon" src="../img/BookStoreLogo.png" alt="Account"></a>
                <figcaption>Access Account</figcaption>
            </figure>
        </button>
        <a href="../home.html" class="header-click"></a>
        
    </header>
    <nav>
        <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="products.html">Products</a></li>
        </ul>
    </nav>

    <div class="main">
        <form id="checkoutForm">
            
            <div class="topRow">
                <div class="submitForm" id="personalInfo">
                    <h2 class="title">Personal Information</h2>
                
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname">

                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname">

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">

                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">
              
            </div>

                
            <div class="submitForm" id="shipping">
                <h2 class="title">Shipping</h2>
                
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address">

                    <label for="country">Country</label>
                    <select name="country" id="country">
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="USA">USA</option>
                    </select>

                    <label for="city">City</label>
                    <input type="text" id="city" name="city">

                    <label id="province" for="province">Province</label>
                    <select name="province" id="provinceSelect"></select>


                    <label id="postal" for="postal">Postal Code</label>
                    <input type="text" id="code" name="postal">
                </div>
            </div>
            <button type="submit" id="checkoutButton" onclick="placeOrder()">Place Order</button>
        </form>

        <div class="bottomRow">
            <div id="deliveryOptions">
                <h2>Delivery Options</h2>

                <div class="deliveryRow">
                    <input type="radio" name="delivery" id="regular" value="regular" checked>
                    <label for="regular">
                        Regular Parcel
                        <span id="regularPrice"></span>
                    </label>
                </div>

                <div class="deliveryRow">
                    <input type="radio" name="delivery" id="priority" value="priority">
                    <label for="priority">
                        Priority Mail
                        <span>$12.99</span>
                    </label>
                </div>
            </div>
            
            <div id="Summary"></div>
            <div id="orderSummary">
                <div id="cartItems"></div> 
            </div>
        </div>
    </div>


    <footer>
        <nav>
            <div class="footer-container">
                <ul id="footerList">
                    <li>
                        <a href="about.html">About</a>
                    </li>
                    <li>
                        <a href="contact.html">Contact</a>
                    </li>
                    <li>
                        <div class="newsletter">
                            <label>Subscribe to our newsletter</label>
                            <input type="email" placeholder="Enter your email">
                            <button type="button">Subscribe</button>
                        </div>
                    </li>
                </ul>

                <div>
                    <p class="contact">Contact us: 821 Sainte-Croix Ave, Montreal H4L 3X9, Quebec 514-744-7500</p>
                </div>

                <div class="socials">
                    <label>Find us on social media</label>
                    <button type="button">
                        <img class="icon" src="../img/instagram.png" alt="Instagram">
                    </button>
                    <button type="button">
                        <img class="icon" src="../img/tiktok.png" alt="TikTok">
                    </button>
                    <button type="button">
                        <img class="icon" src="../img/twitter.png" alt="Twitter">
                    </button>
                </div>
            </div>
        </nav>
    </footer>
    
</body>
</html>
