<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link href="../stylesheet/baseStyle.css" rel="stylesheet" type="text/css">
    <link href="../stylesheet/checkoutStyle.css" rel="stylesheet" type="text/css">
    
    <script src="../javascript/shoppingCart.js" defer></script>
</head>
<body>
     <header>
        <button type="button" id="login">
            <figure>
                <a href="login.html"><img class="icon" src="../img/BookStoreLogo.png" alt="Account"></a>
                <figcaption>Access Account</figcaption>
            </figure>
        </button>
        <a href="../home.html" class="header-click"></a>
        
    </header>
    <nav>
        <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="products.html">Products</a></li>
            <li><input type="text" placeholder="Search...">
                <button style="border: 1px solid white;" type="button">Enter</button>
            </li>
        </ul>
    </nav>

    <div class="main">
        <div class="leftSide">
            <div class="submitForm" id="personalInfo">
                <h2>Personal Information</h2>
                <form>
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname">

                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname">

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">

                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">
                </form>
            </div>

                
            <div class="submitForm" id="shipping">
                <h2>Shipping</h2>
                <form>
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address">

                    <label for="country">Country</label>
                    <select name="country" id="country">
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="USA">USA</option>
                    </select>

                    <label for="city">City</label>
                    <input type="text" id="city" name="city">

                    <label for="province">Province</label>
                    <select name="province" id="province">
                        <option value="Alberta">Alberta</option>
                        <option value="British Columbia">British Columbia</option>
                        <option value="Manitoba">Manitoba</option>
                        <option value="New Brunswick">New Brunswick</option>
                        <option value="Newfoundland">Newfoundland</option>
                        <option value="Northwest Territories">Northwest Territories</option>
                        <option value="Nova Scotia">Nova Scotia</option>
                        <option value="Nunavut">Nunavut</option>
                        <option value="Prince Edward Island">Prince Edward Island</option>
                        <option value="Quebec">Quebec</option>
                        <option value="Saskatchewan">Saskatchewan</option>
                        <option value="Yukon">Yukon</option>
                    </select>


                    <label for="postal">Postal Code</label>
                    <input type="text" id="postal" name="postal">

                    <input type="button" value="Continue" id="continue">
                </form>
            </div>
        </div>

        <div class="rightSide">
            <div id="Summary"></div>
             <div id="cartItems"></div>  
        </div>
    </div>


    <footer>
        <nav>
            <div class="footer-container">
                <ul id="footerList">
                    <li>
                        <a href="about.html">About</a>
                    </li>
                    <li>
                        <a href="contact.html">Contact</a>
                    </li>
                    <li>
                        <div class="newsletter">
                            <label>Subscribe to our newsletter</label>
                            <input type="email" placeholder="Enter your email">
                            <button type="button">Subscribe</button>
                        </div>
                    </li>
                </ul>

                <div>
                    <p class="contact">Contact us: 821 Sainte-Croix Ave, Montreal H4L 3X9, Quebec 514-744-7500</p>
                </div>

                <div class="socials">
                    <label>Find us on social media</label>
                    <button type="button">
                        <img class="icon" src="../img/instagram.png" alt="Instagram">
                    </button>
                    <button type="button">
                        <img class="icon" src="../img/tiktok.png" alt="TikTok">
                    </button>
                    <button type="button">
                        <img class="icon" src="../img/twitter.png" alt="Twitter">
                    </button>
                </div>
            </div>
        </nav>
    </footer>
    
</body>
</html>
