<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>

    <link href="../stylesheet/baseStyle.css" rel="stylesheet" type="text/css">
    <link href="../stylesheet/searchStyle.css" rel="stylesheet" type="text/css">
    <script src="../javascript/search.js" defer></script>
    <script src="../javascript/searchResults.js" defer></script>
    <script src="../javascript/acc.js" defer></script>
</head>
<body>
     <header>
        <button type="button" id="login">
            <figure>
                <a href="../pages/login.html"><img class="icon" src="../img/BookStoreLogo.png" alt="Account"></a>
                <figcaption>Access Account</figcaption>
            </figure>
        </button>
        <a href="../home.html" class="header-click"></a>
        <button type="button" id="cart">
            <figure>
                <a href="../pages/shoppingCart.html"><img class="icon" src="../img/CartLogo.png" alt="Checkout"></a>
                <figcaption>Checkout</figcaption>
            </figure>
        </button>
    </header>
    <nav>
        <ul>
            <li><a href="../pages/about.html">About</a></li>
            <li><a href="../pages/products.html">Products</a></li>
            <li class="searchBar">
                <input type="text" id="searchInput" placeholder="Search...">
                <button style="border: 1px solid white;" type="button" id="searchButton">Enter</button>

                <ul id="suggestions"></ul>
            </li>
        </ul>
    </nav>

   <div id="main">
    <h1 id="searchTitle">Search Results</h1>
    <div id="results"></div>
</div>

    <footer>
        <nav>
            <div class="footer-container">
                <ul id="footerList">
                    <li>
                        <a href="about.html">About</a>
                    </li>
                    <li>
                        <a href="contact.html">Contact</a>
                    </li>
                    <li>
                        <div class="newsletter">
                            <label>Subscribe to our newsletter</label>
                            <input type="email" placeholder="Enter your email">
                            <button type="button">Subscribe</button>
                        </div>
                    </li>
                </ul>

                <div>
                    <p class="contact">Contact us: 821 Sainte-Croix Ave, Montreal H4L 3X9, Quebec 514-744-7500</p>
                </div>

                <div class="socials">
                    <label>Find us on social media</label>
                    <button type="button">
                        <img class="icon" src="../img/instagram.png" alt="Instagram">
                    </button>
                    <button type="button">
                        <img class="icon" src="../img/tiktok.png" alt="TikTok">
                    </button>
                    <button type="button">
                        <img class="icon" src="../img/twitter.png" alt="Twitter">
                    </button>
                </div>
            </div>
        </nav>
    </footer>
    
</body>
</html>
